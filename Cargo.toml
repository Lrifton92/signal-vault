[workspace]

[package]
name = "signal_vault"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Sealed-bid trading signal vault for the Tari Ootle: sell a signal without revealing it, prove the track record after expiry."

[package.metadata.tari-template]
tags = ["trading", "signals", "privacy", "commitment", "marketplace"]
category = "defi"
documentation = "https://github.com/Lrifton92/signal-vault#readme"
homepage = "https://github.com/Lrifton92/signal-vault"

[dependencies]
tari_template_lib = "0.31.1"
tari_template_abi = "0.19.1"
# Blake2b-256 in pure Rust. The commitment is hashed inside the template rather than by an engine
# intrinsic, so the published crates alone are enough to reproduce this build.
blake2 = { version = "0.10", default-features = false }
minicbor = { version = "2.3", default-features = false, features = ["derive", "alloc"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tari_ootle_template_build = "0.11"

# End-to-end test only (tests/end_to_end.rs). These pull the Ootle engine, which pulls a Cranelift
# JIT that refuses to compile on Windows — so `cargo test` is a Linux/macOS and CI operation. The
# wasm build itself does not use any of this.
[dev-dependencies]
tari_template_test_tooling = "0.40"
tari_engine_types = "0.40"
# Pin required: tari_engine 0.40.0 as published declares `wasmer = "^7.1.0"`, but its
# `wasm/module.rs` calls `BaseTunables::for_target`, which no longer exists in wasmer 7.4.
# Without this pin cargo resolves 7.4.0 and tari_engine fails to build (E0599). Upstream main
# already narrowed the constraint to `~7.1.0`; this pin can go once that reaches crates.io.
wasmer = "=7.1.0"
tari_template_lib = "0.31.1"
tari_template_lib_types = "0.31.0"
