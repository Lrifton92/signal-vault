# Test-only template: holds a confidential resource and hands out buckets from withdraw proofs.
# Its own workspace root so cargo does not treat it as a member of the signal_vault package.
[workspace]

[package]
name = "confidential_faucet"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tari_template_lib = "0.31.1"

[lib]
crate-type = ["cdylib"]
